name: Build and Publish npm Packages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Bump Versions
        run: |
          npm version patch --workspace @medusa-vue/toolbox --no-git-tag-version --no-commit-hooks
          npm version patch --workspace @medusa-vue/icons --no-git-tag-version --no-commit-hooks
          npm version patch --workspace @medusa-vue/ui-preset --no-git-tag-version --no-commit-hooks
          npm version patch --workspace @medusa-vue/ui --no-git-tag-version --no-commit-hooks

      - name: Build Packages
        run: npm run build:packages

      - name: Publish to npm
        run: npm run publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

          
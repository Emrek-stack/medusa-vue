name: Changesets Version PR

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update release PR
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: Version Packages
          title: Version Packages
        env:
          # Fallback order:
          # 1) CHANGESETS_GH_PAT (classic/fine-grained PAT with PR write access)
          # 2) Default GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GH_PAT || secrets.GITHUB_TOKEN }}

      # Alternative direct-main flow:
      # Add `publish: npm run release` above and remove the separate release workflow
      # if you want versioning and publish to happen in one workflow on main pushes.
